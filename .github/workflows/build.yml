name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: robocode-dev/tank-royale
          ref: fd06b97a61c9aa264e6964520a30262f8f8be751
          path: tank-royale-source
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            11
            17
          cache: gradle
      - if: runner.os != 'Windows'
        run: ./gradlew --no-configuration-cache -PtankRoyaleSource=tank-royale-source build
      - if: runner.os == 'Windows'
        run: .\gradlew.bat --no-configuration-cache "-PtankRoyaleSource=tank-royale-source" build
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: native-distributions
          path: build/distributions/*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: robocode-dev/tank-royale
          ref: fd06b97a61c9aa264e6964520a30262f8f8be751
          path: tank-royale-source
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test runtime refresh logic
        run: python scripts/test_update_runtime_versions.py
      - name: Build four-language smoke bots
        working-directory: tank-royale-source
        run: ./gradlew --no-daemon --no-configuration-cache -x :bot-api:dotnet:test :sample-bots:java:build :sample-bots:csharp:build :sample-bots:python:build :sample-bots:typescript:build
      - uses: docker/setup-buildx-action@v3
      - name: Build and verify the hardened four-language container
        env:
          TANK_ROYALE_SOURCE: ${{ github.workspace }}/tank-royale-source
        run: bash scripts/verify-container.sh
