name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned Tank Royale commit
        id: pin
        shell: bash
        run: echo "commit=$(tr -d '[:space:]' < TANK_ROYALE_COMMIT)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: robocode-dev/tank-royale
          ref: ${{ steps.pin.outputs.commit }}
          path: tank-royale-source
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            11
            17
          cache: gradle
      - run: ./gradlew --no-configuration-cache -PtankRoyaleSource=tank-royale-source build
      - uses: actions/upload-artifact@v4
        with:
          name: native-distributions
          path: build/distributions/*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned Tank Royale commit
        id: pin
        shell: bash
        run: echo "commit=$(tr -d '[:space:]' < TANK_ROYALE_COMMIT)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: robocode-dev/tank-royale
          ref: ${{ steps.pin.outputs.commit }}
          path: tank-royale-source
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Read the Rumble's supported runtime versions
        id: runtimes
        shell: bash
        # The one list of the versions the Rumble supports; nothing else in this workflow names them.
        run: |
          for name in java dotnet python node; do
            echo "$name=$(sed -n "s/^$name=//p" src/main/resources/runtime-versions.properties | tr -d '\r')" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.runtimes.outputs.python }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.runtimes.outputs.dotnet }}.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.runtimes.outputs.node }}
      - name: Test runtime refresh logic
        run: python scripts/test_update_runtime_versions.py
      - name: Build four-language smoke bots
        run: bash scripts/build-sample-bots.sh tank-royale-source
      - uses: docker/setup-buildx-action@v3
      - name: Build and verify the hardened four-language container
        env:
          TANK_ROYALE_SOURCE: ${{ github.workspace }}/tank-royale-source
        run: bash scripts/verify-container.sh
