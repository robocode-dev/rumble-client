name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: robocode-dev/tank-royale
          ref: fd06b97a61c9aa264e6964520a30262f8f8be751
          path: tank-royale-source
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            11
            17
          cache: gradle
      - if: runner.os != 'Windows'
        run: ./gradlew --no-configuration-cache -PtankRoyaleSource=tank-royale-source build
      - if: runner.os == 'Windows'
        run: .\gradlew.bat --no-configuration-cache "-PtankRoyaleSource=tank-royale-source" build
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: native-distributions
          path: build/distributions/*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: robocode-dev/tank-royale
          ref: fd06b97a61c9aa264e6964520a30262f8f8be751
          path: tank-royale-source
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Python and Java smoke bots
        run: ./tank-royale-source/gradlew --no-daemon --no-configuration-cache :sample-bots:java:build :sample-bots:python:build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rumble-client:test
      - run: docker run --rm --read-only --network none --tmpfs /tmp:rw,nosuid,nodev,size=1g --cap-drop ALL --security-opt no-new-privileges rumble-client:test --check-runtimes
      - run: test "$(docker run --rm --entrypoint id rumble-client:test -u)" != "0"
      - name: Run Python bot through Battle Runner
        run: >-
          docker run --rm --read-only --network none
          --tmpfs /tmp:rw,nosuid,nodev,size=1g
          --cap-drop ALL --security-opt no-new-privileges
          --mount type=bind,source=${GITHUB_WORKSPACE}/tank-royale-source/sample-bots/java/build/archive,target=/work/bots/java,readonly
          --mount type=bind,source=${GITHUB_WORKSPACE}/tank-royale-source/sample-bots/python/build/archive,target=/work/bots/python,readonly
          --mount type=bind,source=${GITHUB_WORKSPACE}/docker/smoke-python.jsh,target=/work/smoke-python.jsh,readonly
          --entrypoint jshell rumble-client:test
          --class-path '/opt/rumble-client/lib/*' /work/smoke-python.jsh
