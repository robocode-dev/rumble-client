name: Refresh runtime lanes

on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-runtime-lanes
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Update runtime policy from official feeds
        run: python scripts/update_runtime_versions.py
      - name: Detect runtime changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- src/main/resources/runtime-versions.properties README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out the pinned Tank Royale source
        if: steps.changes.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: robocode-dev/tank-royale
          ref: fd06b97a61c9aa264e6964520a30262f8f8be751
          path: tank-royale-source
          persist-credentials: false
      - uses: actions/setup-java@v5
        if: steps.changes.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: '24'
      - name: Build sample bots
        if: steps.changes.outputs.changed == 'true'
        working-directory: tank-royale-source
        run: ./gradlew --no-daemon --no-configuration-cache :sample-bots:java:build :sample-bots:csharp:build :sample-bots:python:build :sample-bots:typescript:build
      - name: Test the refreshed image and all bot platforms
        if: steps.changes.outputs.changed == 'true'
        env:
          TANK_ROYALE_SOURCE: ${{ github.workspace }}/tank-royale-source
        run: bash scripts/verify-container.sh
      - name: Open a reviewable refresh pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/runtime-refresh
          delete-branch: true
          commit-message: 'chore: refresh Rumble runtime lanes'
          title: 'Refresh Rumble runtime lanes'
          body: |
            This pull request was generated by the monthly runtime refresh workflow.

            The updater reads the official release feeds for Eclipse Temurin/Adoptium, Microsoft .NET, Python, and Node.js, then the workflow builds the image and runs hardened checks plus Java, C#, Python, and TypeScript one-round battles before opening this pull request.

            The pull request is intentionally not auto-merged or auto-published.
