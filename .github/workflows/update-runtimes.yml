name: Refresh runtime lanes

on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-runtime-lanes
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the Rumble's supported runtime versions
        id: current
        shell: bash
        # The one list of the versions the Rumble supports; nothing else in this workflow names them.
        run: |
          for name in java dotnet python node; do
            echo "$name=$(sed -n "s/^$name=//p" src/main/resources/runtime-versions.properties | tr -d '\r')" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.current.outputs.python }}
      - name: Update runtime policy from official feeds
        run: python scripts/update_runtime_versions.py
      - name: Detect runtime changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- src/main/resources/runtime-versions.properties README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Read the pinned Tank Royale commit
        if: steps.changes.outputs.changed == 'true'
        id: pin
        shell: bash
        run: echo "commit=$(tr -d '[:space:]' < TANK_ROYALE_COMMIT)" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned Tank Royale source
        if: steps.changes.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: robocode-dev/tank-royale
          ref: ${{ steps.pin.outputs.commit }}
          path: tank-royale-source
          persist-credentials: false
      - name: Read the refreshed runtime versions
        if: steps.changes.outputs.changed == 'true'
        id: runtimes
        shell: bash
        # The one list of the versions the Rumble supports; nothing else in this workflow names them.
        run: |
          for name in java dotnet python node; do
            echo "$name=$(sed -n "s/^$name=//p" src/main/resources/runtime-versions.properties | tr -d '\r')" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/setup-java@v5
        if: steps.changes.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          dotnet-version: ${{ steps.runtimes.outputs.dotnet }}.0.x
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: ${{ steps.runtimes.outputs.node }}
      - name: Build sample bots
        if: steps.changes.outputs.changed == 'true'
        run: bash scripts/build-sample-bots.sh tank-royale-source
      - name: Test the refreshed image and all bot platforms
        if: steps.changes.outputs.changed == 'true'
        env:
          TANK_ROYALE_SOURCE: ${{ github.workspace }}/tank-royale-source
        run: bash scripts/verify-container.sh
      - name: Open a reviewable refresh pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            src/main/resources/runtime-versions.properties
            README.md
          branch: automation/runtime-refresh
          delete-branch: true
          commit-message: 'chore: refresh Rumble runtime lanes'
          title: 'Refresh Rumble runtime lanes'
          body: |
            This pull request was generated by the monthly runtime refresh workflow.

            The updater reads the official release feeds for Eclipse Temurin/Adoptium, Microsoft .NET, Python, and Node.js, then the workflow builds the image and runs hardened checks plus Java, C#, Python, and TypeScript one-round battles before opening this pull request.

            The pull request is intentionally not auto-merged or auto-published.
